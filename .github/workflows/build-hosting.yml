name: Build ke branch hosting

# Setiap push ke main: build website, lalu hasil jadinya (_site) dikirim ke branch "hosting".
# Di cPanel: Git Version Control > Manage > Pull or Deploy > Update from Remote > Deploy HEAD Commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hosting
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hosting
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: true
          commit_message: "Build website"
